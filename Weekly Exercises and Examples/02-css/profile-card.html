<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <style>
        body {
            margin: 0;
            padding: 60px 16px;
            background-color: aliceblue;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px;
            border: 2px solid gray;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 4px 10px #0002;
        }

        #profile-name {
            margin: 24px 0 0;
            color: purple;
            font-size: 30px;
            text-align: center;
        }

        .job-title {
            margin: 0 0 24px;
            color: #595959;
            font-size: 22px;
            font-style: italic;
            text-align: center;
        }

        #bio {
            padding: 18px;
            border-radius: 6px;
            background-color: #f2f2f2;
            font-style: italic;
            line-height: 1.5;
        }

        h3 {
            padding: 12px;
            background-color: yellow;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            font: inherit;
        }

        input[type="email"] {
            border: 2px solid blue;
        }

        input[type="tel"] {
            border: 2px solid green;
        }

        .skills h3 {
            color: red;
        }

        .skill {
            display: inline-block;
            margin: 0 8px 12px 0;
            padding: 7px 12px;
            border-radius: 12px;
            background-color: green;
            color: white;
            transition: transform 150ms;
        }

        .highlight-skill {
            background-color: orange;
            color: #231700;
        }

        .skill:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h2 id="profile-name">Carlson C.</h2>
        <p class="job-title">AI Bootcamp Student</p>
        <p id="bio">I am learning web development and AI. I am building small projects to practise what I learn in class.</p>
        <div class="contact-info">
            <h3>Contact Information</h3>
            <input type="email" aria-label="Email" placeholder="your.email@example.com" readonly>
            <input type="tel" aria-label="Telephone" placeholder="+1234567890" readonly>
        </div>
        <div class="skills">
            <h3>Technical Skills</h3>
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill highlight-skill">JavaScript</span>
            <span class="skill">React</span>
            <span class="skill">Node.js</span>
        </div>
    </div>
</body>
</html>
