<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comparison of models</title>
</head>
<body>
    <table border="1" width="600" cellspacing="0">
        <caption>Comparison of models</caption>
        <thead>
            <tr>
                <th width="25%">Model</th>
                <th width="25%">OS</th>
                <th width="25%">Display</th>
                <th width="25%">RAM</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center" valign="top">
                <td>Samsung Galaxy<br>S7</td>
                <td rowspan="2">Android</td>
                <td>5.1&rdquo;</td>
                <td>4 GB</td>
            </tr>
            <tr align="center" valign="top">
                <td>Sony Xperia Z5</td>
                <td>4.6&rdquo;</td>
                <td rowspan="2">2 GB</td>
            </tr>
            <tr align="center" valign="top">
                <td>Apple iPhone 6s</td>
                <td>iOS</td>
                <td>4.7&rdquo;</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
