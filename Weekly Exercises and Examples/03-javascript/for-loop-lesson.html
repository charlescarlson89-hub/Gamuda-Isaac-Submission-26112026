<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="vieport" content="width=device-width, initial scale=1.0">
    <title> For Loop Lesson</title>
</head>

<body>

    <h1>Counter-Controlled Loop Practice</h1>

    <script>

        let myArray = [4, 5, 6, 10, 12];
        let total = 0;

        for (let i = 0; i <myArray.length; i++) {
            total += myArray[i];
        }

        console.log(total);
        
    </script>
</body>
</html>
