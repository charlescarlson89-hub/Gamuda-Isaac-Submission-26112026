<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Object</title>
</head>
<body>
    <script>
        let student = {
            firstName: "Susan",
            lastName: "Lee",
            age: 19
        };

        console.log(student.firstName);
        console.log(student["lastName"]);

        student.age = 20;
        console.log(student.age);
    </script>
</body>
</html>
