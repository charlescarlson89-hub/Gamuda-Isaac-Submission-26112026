<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop Lesson</title>
</head>

<body>

    <h1>JavaScript While Loop Practice</h1>

    <script>

       let number;
       let total = 0;

       do {
        number = Math.floor((Math.random()* 10) +1);
        console.log(number);
        total += number;
       }
       while (number <8);

       console.log("The sum of number is " + total);

    </script>

</body>

</html>
