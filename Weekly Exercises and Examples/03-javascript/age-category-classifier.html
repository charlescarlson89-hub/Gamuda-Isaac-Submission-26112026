<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Age Category Classifier</title>
</head>
<body>
    <script>
        let age = Number(prompt("Enter your age: "));

        if (age >= 0 && age <= 12) {
            console.log("Child");
        } else if (age >= 13 && age <= 19) {
            console.log("Teenager");
        } else if (age >= 20 && age <= 64) {
            console.log("Adult");
        } else if (age >= 65) {
            console.log("Senior");
        } else {
            console.log("Invalid age");
        }
    </script>
</body>
</html>
